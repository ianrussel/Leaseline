# Leaseline maintenance-triage (task.type: extraction) - a real product's own data, not a
# public benchmark, unlike every other config in this folder. From a tenant's raw message,
# extract category + urgency (both closed-set, graded by common.field_accuracy) and draft a
# reply (rides along in the training target, not graded - open-ended text, same reasoning
# task-ticket-extraction used to exclude free-text fields from its own FIELDS list).
#
# Data: trainings/task-leaseline-triage/prepare_data.py reads the source project's own
# already-built, already-QA'd dataset (dataset/train.diverse.jsonl + eval.diverse.jsonl under
# personal/passiveincome/firstproject, a sibling checkout - see that script's docstring).
# targets.mode: none - the labels are the source generator's own values, no teacher pass here.
#
# Small base, no judge to load - same cheap/fast shape as config_extraction.yaml/config_commands.yaml.
# This is the extraction task type's SECOND real exercise (config_extraction.yaml's ticket-field
# run has code but, per handover/README.md's "Still open" section, had not actually been run as
# of this config's creation) - treat the first pipeline run here as also exercising that code
# path for the first time, not as proven-safe already.

# IMPORTANT: .bashrc exports FT_DATA_DIR=/data/ait-lab/ft-data/module-data globally, which
# common.py's data_dir() uses INSTEAD OF this file's data.dir (not joined with it - a full
# override, flat, shared across every task). Running this task's prepare_data.py/targets.py
# without overriding that first will silently overwrite whatever task's data currently lives in
# the shared folder. Always invoke with an isolated override, e.g.:
#   FT_DATA_DIR=/data/ait-lab/ft-data/leaseline-data FT_OUT_DIR=/data/ait-lab/ft-data/leaseline-runs \
#     python ../task-leaseline-triage/prepare_data.py --config config_leaseline.yaml
# (This bit once already: an early run here overwrote module-serverfault-tags' live gold.jsonl/
# train_raw.jsonl in the shared folder. Recovered byte-identical from handover/module-serverfault-
# tags/data/ since that task was already archived - but it would not have been recoverable if it
# hadn't been. Don't repeat this without the override above.)

name: leaseline-triage
task:
  type: extraction

base_model: Qwen/Qwen2.5-1.5B-Instruct

targets:
  mode: none
  approved: true

data:
  dir: "data-leaseline"
  probes_dir: "../task-dataset-generation-pipeline1/eval"
  gold: gold.jsonl
  train_raw: train_raw.jsonl
  train_targets: train_targets.jsonl
  train_mix: train_mix.jsonl
  labels: labels.txt                 # unused for this task type; kept for schema consistency
  sentinel: sentinel.jsonl
  reasoning_probes: reasoning_probes.jsonl
  tool_probes: tool_probes.jsonl

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

train:
  epochs: 3
  learning_rate: 0.0002
  max_seq_len: 1024
  batch_size: 1
  grad_accum: 16
  use_qlora: true
  seeds: [0, 1]             # gate decides on the median across seeds
  early_stopping:
    enabled: false          # extraction is not a supported early_stopping.py task_type yet
                             # (classification/structured only) - fixed-epoch + gate + multi-seed
                             # median is this module's proven reliable default.
    eval_batch: 8

guardrails:
  replay_mix: false          # no rehearsal pool wired for this task yet; plain task data only

acceptance:
  min_win_rate: 0.55         # generative only; unused here
  min_task_gain: 0.05        # extraction: mean field-accuracy gain over base (category+urgency)
  max_regression_drop: 0.05

adjust_on_fail:
  force_replay: true
  lower_lr_factor: 0.5
  reduce_epochs_to: 2

output_dir: runs-leaseline

# prepare_data.py must run first (writes data-leaseline/gold.jsonl, train_raw.jsonl from the
# sibling project's own dataset). Since targets.mode: none, targets.py still needs to run once
# to turn train_raw into train_targets/train_mix. Review gold.jsonl by hand - this is a real
# product's actual training data, not a throwaway benchmark - then flip this to true. Costs real
# rented-GPU money once pipeline.py runs; don't flip without looking.
confirmed: false
